[project]
name = "snelstart-web-mcp"
version = "2026.11.25.5"
description = "Local MCP for SnelStart Web with automatic sign-in and token renewal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "keyring>=25.7,<26", "packaging>=24,<27", "pydantic>=2.12,<3", "rich>=14,<16", "tomlkit>=0.13,<1"]

[project.urls]
Repository = "https://github.com/Martijn-minus/snelstart-web-mcp"
Changelog = "https://github.com/Martijn-minus/snelstart-web-mcp/releases"
"Usage and liability" = "https://github.com/Martijn-minus/snelstart-web-mcp/blob/main/NOTICE.md"

[project.optional-dependencies]
browser = ["playwright>=1.54,<2"]

[project.scripts]
snelstart-mcp = "snelstart_mcp.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.32,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
    "twine>=7,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snelstart_mcp"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/snelstart_mcp", "tests", "README.md", "README.nl.md", "NOTICE.md", "pyproject.toml", "install.sh",
    ".agents/plugins/marketplace.json", ".codex-plugin/plugin.json", ".mcp.json", "hooks", "scripts/codex",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
