name: Release to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release tag matches the calendar version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from datetime import date
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          match = re.fullmatch(r"(\d{4})\.([1-9]\d?)\.([1-9]\d?)(?:\.post[1-9]\d*)?", version)
          if not match:
              raise SystemExit("Use YYYY.M.D or YYYY.M.D.postN for a release version.")
          date(*map(int, match.groups()))
          if os.environ["GITHUB_REF"] != f"refs/tags/v{version}":
              raise SystemExit(f"Run this workflow on tag v{version}.")
          PY

  build:
    needs: verify-tag
    uses: ./.github/workflows/snelstart-mcp.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/snelstart-web-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snelstart-mcp-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
