name: SnelStart MCP

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python }}
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --locked --extra browser
      - name: Check formatting, typing and repository files
        run: uv run --frozen --extra browser pre-commit run --all-files
      - name: Run offline tests
        run: uv run --frozen --extra browser pytest -q tests

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.11"
          cache-dependency-glob: uv.lock
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Validate PyPI metadata and install the wheel
        run: |
          uv run --locked twine check --strict dist/*
          uv run --isolated --no-project --with dist/*.whl snelstart-mcp --version
          uv run --isolated --no-project --with dist/*.whl snelstart-mcp login --help
          uv run --isolated --no-project --with dist/*.whl snelstart-web-mcp serve --help
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snelstart-mcp-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
